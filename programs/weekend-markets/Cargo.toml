[package]
name = "weekend-markets"
version = "0.1.0"
description = "Binary prediction markets on tokenized-stock prices, settled trustlessly by Pyth"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "weekend_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# `pro-compatible` targets the upgraded Pyth receiver (rec2HHDD...) that
# Pyth Core moved to on 2026-08-26. See docs.pyth.network upgrade guide.
pyth-solana-receiver-sdk = { version = "2.0.0", features = ["pro-compatible"] }

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
